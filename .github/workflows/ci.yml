name: CI Quality & Syntax Check

on:
  push:
    branches: [ main, private-deploy ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    name: PHP Syntax & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, mbstring, json

      - name: Check PHP Syntax (All Directories)
        run: |
          find src config public scripts tests -type f -name "*.php" -exec php -l {} +

      - name: Run PHP Offline Unit & Security Tests
        run: |
          php tests/secret-hygiene.test.php
          php tests/ssrf-test-console.test.php
          php tests/csv-import-security.test.php

  node-check:
    name: Node.js Worker Lint & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker Dependencies
        run: |
          cd worker
          npm ci

      - name: Verify Syntax of All Worker Modules
        run: |
          for file in worker/*.mjs; do
            node --check "$file"
          done

      - name: Run Worker Unit & Security Tests
        run: |
          node --test tests/batch1-worker-security.test.mjs tests/batch2-worker-security.test.mjs tests/test_debouncer.mjs tests/docker-volume-persistence-audit.test.mjs tests/env-example-audit.test.mjs tests/security-maintenance-isolation.test.mjs tests/shared-hosting-antibot-bypass-audit.test.mjs tests/worker-token-timing.test.mjs
